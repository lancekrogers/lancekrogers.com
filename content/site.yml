                  code: |
                      contract OptimizedMarketplace {
                          mapping(uint256 => uint256) private _prices; // tokenId => price
                          mapping(uint256 => address) private _sellers; // tokenId => seller

                          event Listed(uint256 indexed tokenId, uint256 price, address seller);

                          function listItem(uint256 tokenId, uint256 price) external {
                              require(IERC721(nftContract).ownerOf(tokenId) == msg.sender, "Not owner");
                              require(price > 0, "Price must be > 0");

                              _prices[tokenId] = price;
                              _sellers[tokenId] = msg.sender;

                              emit Listed(tokenId, price, msg.sender);
                          }

                          function buyItem(uint256 tokenId) external payable {
                              uint256 price = _prices[tokenId];
                              address seller = _sellers[tokenId];

                              require(price > 0 && seller != address(0), "Not listed");
                              require(msg.value >= price, "Insufficient payment");

                              // Clear before transfer (reentrancy protection)
                              delete _prices[tokenId];
                              delete _sellers[tokenId];

                              IERC721(nftContract).safeTransferFrom(seller, msg.sender, tokenId);
                              payable(seller).transfer(price);
                          }
                      }
