                      type RAGSystem struct {
                          vectorDB     *VectorDatabase
                          llmClient    *anthropic.Client
                          embedder     *EmbeddingService
                      }

                      func (r *RAGSystem) Query(ctx context.Context, query string) (*Response, error) {
                          // Generate query embedding
                          queryEmbed, err := r.embedder.Embed(ctx, query)
                          if err != nil {
                              return nil, fmt.Errorf("embedding failed: %w", err)
                          }

                          // Retrieve relevant documents
                          docs, err := r.vectorDB.Search(ctx, queryEmbed, 5)
                          if err != nil {
                              return nil, fmt.Errorf("vector search failed: %w", err)
                          }

                          // Build context-aware prompt
                          prompt := r.buildPrompt(query, docs)

                          // Generate response
                          resp, err := r.llmClient.Complete(ctx, prompt)
                          if err != nil {
                              return nil, fmt.Errorf("llm completion failed: %w", err)
                          }

                          return &Response{
                              Answer:    resp.Content,
                              Sources:   docs,
                              Confidence: r.calculateConfidence(docs, resp),
                          }, nil
                      }

