<!DOCTYPE html>
<html>
<head>
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }
        body {
            margin: 0;
            padding: 0;
        }
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: black;
            color: white;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .content {
            padding-top: 80px;
        }
        section {
            height: 100vh;
            padding: 20px;
            border: 2px solid #333;
        }
        .hero-cta {
            margin: 20px;
        }
        .btn-secondary {
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="navbar">Fixed Navbar</div>
    <div class="content">
        <section id="hero">
            <h1>Hero Section</h1>
            <div class="hero-cta">
                <a href="#services" class="btn-secondary">Explore services →</a>
            </div>
        </section>
        <section id="problems">
            <h2>Problems Section</h2>
        </section>
        <section id="services">
            <h2>Services Section</h2>
        </section>
    </div>
</body>
</html>
