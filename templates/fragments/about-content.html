{{define "about-content"}}
<section class="about-hero">
  <div class="container">
    <div class="about-header">
      <div class="about-text">
        {{if .Bio}}
        <h1>{{.Bio.Title}}</h1>
        {{if .Bio.Subtitle}}
        <p class="about-subtitle">{{.Bio.Subtitle}}</p>
        {{end}} {{else}}
        <h1>About Me</h1>
        <p class="about-subtitle">
          Backend Engineer • Fractional CTO
        </p>
        {{end}}
      </div>
      <div class="about-image">
        <img
          src="/static/images/lance_profile.jpg"
          alt="Lance Rogers"
          class="profile-img-large"
        />
      </div>
    </div>
  </div>
</section>

<section class="about-content">
  <div class="container">
    <div class="about-body">
      {{if .Bio}} {{.Bio.Content}} {{else}}
      <p>Content loading...</p>
      {{end}}
    </div>
  </div>
</section>
{{end}}
