{{define "modal-contact"}}
<div id="contact-modal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      
      <div class="modal-header">
        <h2 class="modal-title">Start a Conversation</h2>
        <p class="modal-subtitle">Let's discuss how I can help accelerate your project.</p>
      </div>
      
      <form hx-post="/contact" hx-target="#modal-contact-response" class="modal-contact-form">
        <div class="form-grid">
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
        </div>
        <textarea name="message" placeholder="Tell me about your project..." rows="5" required></textarea>
        <button type="submit" class="btn-primary">Send Message</button>
        <div id="modal-contact-response"></div>
      </form>
    </div>
  </div>
</div>
{{end}}
