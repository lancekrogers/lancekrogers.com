{{define "nav"}}
<nav class="navbar">
  <div class="container">
    <div class="nav-brand">
      <a href="/" hx-get="/content/home" hx-target="#main-content" hx-push-url="/" hx-swap="innerHTML show:window:top" class="brand-text">
        Lance Rogers
      </a>
    </div>
    <!-- Desktop Navigation -->
    <div class="nav-links desktop-nav">
      <a href="/" hx-get="/content/home" hx-target="#main-content" hx-push-url="/" hx-swap="innerHTML show:window:top" {{if eq .Page "home"}}class="active"{{end}}>Home</a>
      <a href="/about" hx-get="/content/about" hx-target="#main-content" hx-push-url="/about" hx-swap="innerHTML show:window:top" {{if eq .Page "about"}}class="active"{{end}}>About</a>
      {{if .Config.BlogEnabled}}
      <a href="/blog" hx-get="/content/blog" hx-target="#main-content" hx-push-url="/blog" hx-swap="innerHTML show:window:top" {{if eq .Page "blog"}}class="active"{{end}}>Blog</a>
      {{end}}
      {{if .Config.CalendarEnabled}}
      <a href="/calendar" class="cta-button {{if eq .Page "calendar"}}active{{end}}">Book Consultation</a>
      {{else}}
      <button data-contact-modal class="cta-button">Connect</button>
      {{end}}
    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-nav">
      <button class="hamburger-menu" id="hamburger-toggle">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <div class="mobile-menu" id="mobile-menu">
        <a href="/" {{if eq .Page "home"}}class="active"{{end}}>Home</a>
        <a href="/about" {{if eq .Page "about"}}class="active"{{end}}>About</a>
        {{if .Config.BlogEnabled}}
        <a href="/blog" hx-get="/content/blog" hx-target="#main-content" hx-push-url="/blog" hx-swap="innerHTML show:window:top" {{if eq .Page "blog"}}class="active"{{end}}>Blog</a>
        {{end}}
        {{if .Config.CalendarEnabled}}
        <a href="/calendar" class="mobile-cta {{if eq .Page "calendar"}}active{{end}}">Book Consultation</a>
        {{else}}
        <button data-contact-modal class="mobile-cta">Connect</button>
        {{end}}
      </div>
    </div>
  </div>
</nav>
{{end}}
